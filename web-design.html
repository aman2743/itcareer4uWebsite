<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Course - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Poppins", sans-serif; /* Matching professional fonts */
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
            color: #333; /* Matching text color */
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #0056b3; /* Matching a professional primary color */
            font-size: 28px;
            font-weight: 600;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }
        .notify-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 26px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .notify-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 Web Design Course - Coming Soon</h1>
        <p>Get ready for an immersive Web Design course! Learn UI/UX, responsive layouts, and cutting-edge design trends.</p>
        <p>Master the art of creating stunning websites that are modern, fast, and user-friendly.</p>
        <a href="#" class="notify-btn">Get Notified</a>
    </div>

</body>
</html>
